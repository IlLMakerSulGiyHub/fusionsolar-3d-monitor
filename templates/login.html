<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - EcoSmart FusionSolar 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070b14;
            color: #f8fafc;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative p-4">

    <!-- Sfondo luminoso animato -->
    <div class="orb w-96 h-96 bg-emerald-500/20 -top-20 -left-20"></div>
    <div class="orb w-96 h-96 bg-amber-500/15 bottom-10 right-10" style="animation-delay: -5s;"></div>
    <div class="orb w-80 h-80 bg-sky-500/15 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" style="animation-delay: -2s;"></div>

    <!-- Card di Login -->
    <div class="glass-card w-full max-w-md rounded-3xl p-8 relative z-10">
        <!-- Logo & Intestazione -->
        <div class="flex flex-col items-center text-center mb-7">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-amber-400 flex items-center justify-center shadow-lg shadow-emerald-500/30 text-slate-950 text-3xl font-extrabold mb-4">
                <i class="fa-solid fa-solar-panel"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">EcoSmart Solar 3D</h1>
            <p class="text-xs text-slate-400 mt-1">Accedi con il tuo account personale <span class="text-emerald-400 font-semibold">Huawei FusionSolar</span></p>
        </div>

        <!-- Messaggio di Errore / Stato -->
        <div id="login-alert" class="hidden mb-5 p-3.5 rounded-xl text-xs font-medium flex items-center gap-2.5 border">
            <i id="login-alert-icon" class="fa-solid fa-circle-exclamation text-base"></i>
            <span id="login-alert-text"></span>
        </div>

        <!-- Form Login -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                    Username o Email FusionSolar
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" id="username" required placeholder="Inserisci username o email..."
                        class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700/80 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                    Password
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••••••"
                        class="w-full pl-10 pr-11 py-3 rounded-xl bg-slate-900/90 border border-slate-700/80 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white">
                        <i id="eye-icon" class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Server Huawei (Automatico o Manuale) -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                    Server Regionale Huawei
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-server"></i>
                    </span>
                    <select id="subdomain"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700/80 text-slate-200 text-xs font-medium focus:outline-none focus:border-emerald-400 transition">
                        <option value="auto" selected>🔍 Rilevamento Automatico Server (Consigliato)</option>
                        <option value="uni001eu5">Europa - uni001eu5</option>
                        <option value="uni002eu5">Europa - uni002eu5</option>
                        <option value="uni003eu5">Europa - uni003eu5</option>
                        <option value="uni004eu5">Europa - uni004eu5</option>
                        <option value="uni005eu5">Europa - uni005eu5</option>
                        <option value="region01eu5">Europa - region01eu5</option>
                        <option value="region02eu5">Europa - region02eu5</option>
                        <option value="region03eu5">Europa - region03eu5</option>
                        <option value="region04eu5">Europa - region04eu5</option>
                    </select>
                </div>
            </div>

            <!-- Box Captcha Dinamico (compare solo se Huawei lo richiede da IP Cloud/Vercel) -->
            <div id="captcha-container" class="hidden p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/40 space-y-2.5">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-bold text-amber-300 uppercase tracking-wider">
                        <i class="fa-solid fa-shield-cat mr-1"></i> Codice Sicurezza Huawei
                    </label>
                    <button type="button" onclick="refreshCaptcha()" class="text-[11px] text-amber-400 hover:text-white underline">
                        <i class="fa-solid fa-rotate-right"></i> Cambia immagine
                    </button>
                </div>
                <div class="flex items-center gap-3">
                    <img id="captcha-img" src="" alt="Captcha Huawei" onclick="refreshCaptcha()" title="Clicca per cambiare immagine"
                        class="h-11 rounded-lg border border-slate-600 bg-white px-2 cursor-pointer select-none">
                    <input type="text" id="verifycode" placeholder="Inserisci codice..."
                        class="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-900 border border-amber-500/50 text-white text-sm font-bold tracking-widest uppercase placeholder-slate-500 focus:outline-none focus:border-amber-400">
                </div>
            </div>

            <!-- Ricordami su questo dispositivo -->
            <div class="flex items-center justify-between pt-1">
                <label class="flex items-center gap-2.5 cursor-pointer text-xs text-slate-300 select-none">
                    <input type="checkbox" id="remember" checked
                        class="w-4 h-4 rounded accent-emerald-500 bg-slate-900 border-slate-700 cursor-pointer">
                    <span>Ricorda il mio account su questo dispositivo (PC / Telefono)</span>
                </label>
            </div>

            <!-- Pulsante Submit -->
            <button type="submit" id="submit-btn"
                class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/25 transition flex items-center justify-center gap-2 mt-2">
                <i id="btn-icon" class="fa-solid fa-right-to-bracket"></i>
                <span id="btn-text">Entra nella Dashboard 3D</span>
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
            <p class="text-[11px] text-slate-500">
                <i class="fa-solid fa-shield-halved text-emerald-400 mr-1"></i>
                Ogni telefono o computer mantiene la propria sessione separata e sicura.
            </p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        async function refreshCaptcha() {
            try {
                const res = await fetch('/api/captcha');
                const data = await res.json();
                if (data.captcha_image) {
                    document.getElementById('captcha-img').src = data.captcha_image;
                    document.getElementById('verifycode').value = '';
                    document.getElementById('verifycode').focus();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function showAlert(msg, type = 'error') {
            const alertBox = document.getElementById('login-alert');
            const alertIcon = document.getElementById('login-alert-icon');
            const alertText = document.getElementById('login-alert-text');

            alertBox.classList.remove('hidden', 'bg-rose-500/15', 'border-rose-500/40', 'text-rose-300', 'bg-emerald-500/15', 'border-emerald-500/40', 'text-emerald-300', 'bg-sky-500/15', 'border-sky-500/40', 'text-sky-300');

            if (type === 'error') {
                alertBox.classList.add('bg-rose-500/15', 'border-rose-500/40', 'text-rose-300');
                alertIcon.className = 'fa-solid fa-triangle-exclamation text-rose-400 text-base';
            } else if (type === 'success') {
                alertBox.classList.add('bg-emerald-500/15', 'border-emerald-500/40', 'text-emerald-300');
                alertIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-base';
            } else {
                alertBox.classList.add('bg-sky-500/15', 'border-sky-500/40', 'text-sky-300');
                alertIcon.className = 'fa-solid fa-spinner fa-spin text-sky-400 text-base';
            }

            alertText.textContent = msg;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const subdomain = document.getElementById('subdomain').value;
            const verifycode = document.getElementById('verifycode').value.trim();
            const remember = document.getElementById('remember').checked;

            const btn = document.getElementById('submit-btn');
            const btnIcon = document.getElementById('btn-icon');
            const btnText = document.getElementById('btn-text');

            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-wait');
            btnIcon.className = 'fa-solid fa-circle-notch fa-spin';
            btnText.textContent = 'Connessione a FusionSolar in corso...';
            showAlert('Autenticazione sul server Huawei FusionSolar in corso...', 'info');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, subdomain, verifycode, remember })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert(`Connesso! Impianto trovato: ${data.plant_name} (${data.subdomain})`, 'success');
                    btnIcon.className = 'fa-solid fa-check';
                    btnText.textContent = 'Accesso riuscito!';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 700);
                } else {
                    if (data.need_captcha && data.captcha_image) {
                        const capBox = document.getElementById('captcha-container');
                        const capImg = document.getElementById('captcha-img');
                        capBox.classList.remove('hidden');
                        capImg.src = data.captcha_image;
                        document.getElementById('verifycode').value = '';
                        document.getElementById('verifycode').focus();
                    }
                    showAlert(data.error || 'Credenziali non valide o impianto non raggiungibile.', 'error');
                    btn.disabled = false;
                    btn.classList.remove('opacity-75', 'cursor-wait');
                    btnIcon.className = 'fa-solid fa-right-to-bracket';
                    btnText.textContent = 'Entra nella Dashboard 3D';
                }
            } catch (err) {
                showAlert('Errore di rete durante la comunicazione col server.', 'error');
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-wait');
                btnIcon.className = 'fa-solid fa-right-to-bracket';
                btnText.textContent = 'Entra nella Dashboard 3D';
            }
        }
    </script>
</body>
</html>
